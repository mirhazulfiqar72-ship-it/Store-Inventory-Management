name: Build Store Inventory Management

on:
  push:
    branches:
      - main
    paths-ignore:
      - version.json
      - SOURCE_AUDIT.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.x'
          architecture: x64
      - name: Extract application source
        shell: pwsh
        run: |
          if (Test-Path "source") { Remove-Item "source" -Recurse -Force }
          Expand-Archive -LiteralPath "Store_Inventory_GITHUB_AUTO_UPDATER_PATCH_V1.zip" -DestinationPath "source" -Force
          Copy-Item -LiteralPath "storage_lock.py" -Destination "source\storage_lock.py" -Force
          Copy-Item -LiteralPath "firebase_sync.py" -Destination "source\firebase_sync.py" -Force
          Copy-Item -LiteralPath "durable_local.py" -Destination "source\durable_local.py" -Force
          if (-not (Test-Path "source\store_inventory.py")) { throw "store_inventory.py was not found inside the source ZIP." }
          if (-not (Test-Path "source\updater.py")) { throw "updater.py was not found inside the source ZIP." }
          if (-not (Test-Path "source\firebase_sync.py")) { throw "firebase_sync.py was not found inside the source ZIP." }
          if (-not (Test-Path "source\durable_local.py")) { throw "durable_local.py was not copied into the source." }
          if (-not (Test-Path "source\firebase_database_url.txt")) { throw "firebase_database_url.txt was not found inside the source ZIP." }
      - name: Patch Firebase and Help update features
        shell: cmd
        run: |
          python ci_patch_source.py
          if errorlevel 1 exit /b 1
      - name: Repair generated updater header
        shell: pwsh
        run: |
          $path = "source\\updater.py"
          $text = Get-Content $path -Raw
          $idx = $text.IndexOf("APP_VERSION")
          if ($idx -lt 0) { throw "APP_VERSION was not found in updater.py" }
          $head = $text.Substring(0, $idx)
          $tail = $text.Substring($idx)
          $head = $head.Replace('\n', [Environment]::NewLine)
          Set-Content -Path $path -Value ($head + $tail) -Encoding UTF8
      - name: Audit real application persistence and report code
        shell: cmd
        run: |
          python source_audit.py
          if errorlevel 1 exit /b 1
          if not exist "SOURCE_AUDIT.md" exit /b 1
      - name: Set release version
        shell: pwsh
        run: |
          $version = "1.0.87"
          $path = "source\updater.py"
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, 'APP_VERSION\s*=\s*["''][^"'']*["'']', "APP_VERSION = `"$version`"")
          Set-Content -Path $path -Value $text -Encoding UTF8
      - name: Set up Python dependencies
        shell: cmd
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          if errorlevel 1 exit /b 1
          pip install pyinstaller reportlab python-docx openpyxl requests pywin32 pymupdf pillow
          if errorlevel 1 exit /b 1
      - name: Create professional inventory icon
        shell: pwsh
        working-directory: source
        run: |
          @'
          from PIL import Image, ImageDraw, ImageFont
          S=256
          im=Image.new("RGBA",(S,S),(20,52,86,255))
          d=ImageDraw.Draw(im)
          # clean warehouse roof/building
          d.polygon([(30,105),(128,38),(226,105)],fill=(244,247,250,255))
          d.rounded_rectangle((42,98,214,220),radius=10,fill=(244,247,250,255))
          d.rectangle((67,128,189,220),fill=(37,99,145,255))
          # stacked inventory cartons
          for box in [(78,143,124,178),(132,143,178,178),(105,184,151,217)]:
              d.rounded_rectangle(box,radius=4,fill=(245,178,66,255))
              x1,y1,x2,y2=box
              d.line((x1,y1+9,x2,y1+9),fill=(255,224,157,255),width=3)
              d.line(((x1+x2)//2,y1,(x1+x2)//2,y1+9),fill=(255,224,157,255),width=3)
          im.save("inventory_professional.ico",sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])

          # Shortcut-only icon #4: dark professional tile + white gear + orange box.
          import math
          K=4
          N=256*K
          ic=Image.new("RGBA",(N,N),(0,0,0,0))
          g=ImageDraw.Draw(ic)
          m=10*K
          g.rounded_rectangle((m,m,N-m,N-m),radius=34*K,fill=(22,38,51,255),outline=(87,105,120,255),width=2*K)

          # white gear
          cx,cy=94*K,102*K
          teeth=10
          pts=[]
          for i in range(teeth*4):
              ang=-math.pi/2 + i*math.pi/(teeth*2)
              phase=i%4
              rr=(54 if phase in (0,1) else 43)*K
              pts.append((cx+math.cos(ang)*rr,cy+math.sin(ang)*rr))
          g.polygon(pts,fill=(246,248,250,255))
          g.ellipse((cx-23*K,cy-23*K,cx+23*K,cy+23*K),fill=(22,38,51,255))

          # orange isometric box in front/right
          top=[(103*K,102*K),(151*K,79*K),(202*K,103*K),(154*K,127*K)]
          front=[(103*K,102*K),(154*K,127*K),(154*K,187*K),(103*K,160*K)]
          side=[(154*K,127*K),(202*K,103*K),(202*K,162*K),(154*K,187*K)]
          g.polygon(top,fill=(255,184,79,255))
          g.polygon(front,fill=(235,145,35,255))
          g.polygon(side,fill=(205,111,16,255))
          # tape / seams
          g.polygon([(145*K,82*K),(157*K,87*K),(157*K,113*K),(145*K,107*K)],fill=(188,99,22,255))
          g.line([(154*K,127*K),(154*K,187*K)],fill=(165,85,15,255),width=2*K)

          # Match selected icon #4 more closely with the INVENTORY / MANAGEMENT label.
          try:
              f1=ImageFont.truetype("arialbd.ttf",88)
              f2=ImageFont.truetype("arial.ttf",40)
          except Exception:
              f1=ImageFont.load_default()
              f2=ImageFont.load_default()
          def centered(txt,y,font):
              box=g.textbbox((0,0),txt,font=font)
              tw=box[2]-box[0]
              g.text(((N-tw)//2,y*K),txt,font=font,fill=(248,248,248,255))
          centered("INVENTORY",205,f1)
          centered("MANAGEMENT",232,f2)

          ic=ic.resize((256,256),Image.Resampling.LANCZOS)
          ic.save("shortcut_icon_4_v1085.ico",sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          # Force the EXE resource icon to the same selected #4 icon.
          ic.save("inventory_professional.ico",sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          '@ | Set-Content create_inventory_icon.py -Encoding UTF8
          python create_inventory_icon.py
          if (-not (Test-Path "inventory_professional.ico")) { throw "Inventory icon was not created." }
          if (-not (Test-Path "shortcut_icon_4_v1085.ico")) { throw "Shortcut icon #4 was not created." }
      - name: Validate Firebase write access
        shell: cmd
        working-directory: source
        run: |
          python -c "from pathlib import Path; import requests,uuid; u=Path('firebase_database_url.txt').read_text(encoding='utf-8-sig').strip().rstrip('/'); p=u+'/store_inventory/_build_write_test_'+uuid.uuid4().hex+'.json'; r=requests.put(p,json={'ok':True},timeout=15); assert r.ok, f'Firebase write failed: {r.status_code} {r.text[:300]}'; d=requests.put(p,data='null',timeout=15); assert d.ok, f'Firebase cleanup failed: {d.status_code} {d.text[:300]}'; print('Firebase REST write/cleanup: OK')"
          if errorlevel 1 exit /b 1
      - name: Validate Firebase read access
        shell: cmd
        working-directory: source
        run: |
          python -c "from pathlib import Path; import requests; u=Path('firebase_database_url.txt').read_text(encoding='utf-8-sig').strip().rstrip('/'); r=requests.get(u+'/store_inventory/data.json',timeout=15); assert r.ok, f'Firebase data read failed: {r.status_code} {r.text[:300]}'; m=requests.get(u+'/store_inventory/_meta.json',timeout=15); assert m.ok, f'Firebase meta read failed: {m.status_code} {m.text[:300]}'; print('Firebase REST read: OK')"
          if errorlevel 1 exit /b 1
      - name: Validate Firebase, updater, storage and application source
        shell: cmd
        working-directory: source
        run: |
          python -c "import sys; print('Python:', sys.version); assert sys.version_info[:2] == (3, 12), sys.version"
          if errorlevel 1 exit /b 1
          python -m py_compile store_inventory.py firebase_sync.py updater.py storage_lock.py durable_local.py
          if errorlevel 1 exit /b 1
          python -c "import firebase_sync; print('firebase_sync import: OK')"
          if errorlevel 1 exit /b 1
          python -c "import durable_local; print('durable_local import: OK')"
          if errorlevel 1 exit /b 1
          python -c "import storage_lock; from pathlib import Path; storage_lock.install(); assert storage_lock.DATA_DIR == Path(r'C:\StoreInventoryManagement\Data'); assert storage_lock.BACKUP_DIR == Path(r'C:\StoreInventoryManagement\Backups'); assert storage_lock.REPORTS_DIR == Path(r'C:\StoreInventoryManagement\Reports'); print('Locked storage paths: OK')"
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; import runpy; p=Path('..')/'journal_debug.py'; assert p.exists(); runpy.run_path(str(p),run_name='__main__'); print('Focused local journal recovery: OK')"
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; import runpy; p=Path('..')/'report_storage_debug.py'; assert p.exists(); runpy.run_path(str(p),run_name='__main__'); print('Report folder write test: OK')"
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; u=Path('firebase_database_url.txt').read_text(encoding='utf-8-sig').strip(); assert u.startswith('https://store-inventory-a46b0-default-rtdb.firebaseio.com'), u; print('Firebase URL: OK')"
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; t=Path('firebase_sync.py').read_text(encoding='utf-8-sig'); assert 'mto_items' in t and 'firebase_pending_sync.json' in t and 'firebase_sync_state.json' in t and 'durable_local.save' in t; print('Durable Firebase/local journal: OK')"
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; t=Path('store_inventory.py').read_text(encoding='utf-8-sig'); assert 'label=\"Check Update\"' in t and 'label=\"Current Version\"' in t; assert 'durable_local.restore_if_newer(raw)' in t and 'durable_local.save(raw)' in t; print('Help and startup recovery controls: OK')"
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; t=Path('store_inventory.py').read_text(encoding='utf-8-sig'); assert 'def backup_database' in t and 'BACKUP_DIR' in t; assert 'REPORTS_DIR' in t and 'def export_preview_pdf' in t; print('Backup/report protections: OK')"
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; t=Path('store_inventory.py').read_text(encoding='utf-8-sig'); assert 'Generated by {current_name}' in t; assert 'Made by Muhammad Shahzad' in t; assert 'def _auto_fit_tree_columns' in t; assert 'wrapped_cells=[]' in t; print('Footer and auto-fit layout: OK')"
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; t=Path('firebase_sync.py').read_text(encoding='utf-8-sig'); assert 'self.check_interval = 10.0' in t and 'kick_background_pull' in t and 'apply_cached_pull' in t; assert 'PRAGMA journal_mode=WAL' in t; print('Non-blocking Firebase performance tuning: OK')"
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; a=Path('store_inventory.py').read_text(encoding='utf-8-sig'); u=Path('updater.py').read_text(encoding='utf-8-sig'); assert 'state_ready = os.path.isfile(sync.state_path)' in a; assert 'threading.Thread(target=worker' in u; print('Fast startup/login path: OK')"
          if errorlevel 1 exit /b 1
      - name: Build EXE
        shell: cmd
        working-directory: source
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --noupx --noconsole --name "StoreInventoryManagement" --icon "shortcut_icon_4_v1085.ico" --collect-all reportlab --collect-all PIL --collect-all fitz --hidden-import updater --hidden-import firebase_sync --hidden-import storage_lock --hidden-import durable_local --hidden-import reportlab.pdfgen.canvas --hidden-import reportlab.lib.utils --hidden-import reportlab.pdfbase._fontdata --add-data "inventory_seed.csv;." --add-data "company_logo.png;." --add-data "firebase_database_url.txt;." --add-data "update_config.json;." --add-data "FIREBASE_RULES_URL_ONLY.json;." store_inventory.py
          if errorlevel 1 exit /b 1
          if not exist "dist\StoreInventoryManagement\StoreInventoryManagement.exe" exit /b 1
      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = "1.0.87"
          $exeDir = (Resolve-Path "source\dist\StoreInventoryManagement").Path
          $exe = Join-Path $exeDir "StoreInventoryManagement.exe"
          $setup = Join-Path $PWD "StoreInventoryManagement_Setup.iss"
          @"
          #define MyAppName "Store Inventory Management"
          #define MyAppVersion "$version"
          #define MyAppPublisher "Store Inventory Management"
          #define MyAppExeName "StoreInventoryManagement.exe"
          [Setup]
          AppId={{8B1E6F8D-5D5B-4B79-9B1E-7E0E9E8D7A31}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName=C:\StoreInventoryManagement
          UsePreviousAppDir=no
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          OutputDir=installer
          OutputBaseFilename=StoreInventoryManagement_Setup_v{#MyAppVersion}
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin
          Uninstallable=yes
          CloseApplications=force
          RestartApplications=no
          WizardStyle=modern
          SetupIconFile=source\\shortcut_icon_4_v1085.ico
          SetupLogging=yes
          [Files]
          Source: "$exeDir\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "source\update_config.json"; DestDir: "{app}"; Flags: ignoreversion
          Source: "source\firebase_database_url.txt"; DestDir: "{app}"; Flags: ignoreversion
          Source: "source\FIREBASE_RULES_URL_ONLY.json"; DestDir: "{app}"; Flags: ignoreversion
          Source: "source\shortcut_icon_4_v1085.ico"; DestDir: "{app}"; Flags: ignoreversion
          [Dirs]
          Name: "{app}"; Permissions: users-modify
          Name: "{app}\Data"; Permissions: users-modify
          Name: "{app}\Backups"; Permissions: users-modify
          Name: "{app}\Reports"; Permissions: users-modify
          [InstallDelete]
          Type: files; Name: "{autodesktop}\Store Inventory Management.lnk"
          Type: files; Name: "{group}\Store Inventory Management.lnk"
          [Icons]
          Name: "{autodesktop}\Store Inventory Management"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"; IconFilename: "{app}\shortcut_icon_4_v1085.ico"; IconIndex: 0
          Name: "{group}\Store Inventory Management"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"; IconFilename: "{app}\shortcut_icon_4_v1085.ico"; IconIndex: 0
          Name: "{group}\Uninstall Store Inventory Management"; Filename: "{uninstallexe}"
          [Code]
          procedure CurStepChanged(CurStep: TSetupStep);
          var
            ResultCode: Integer;
          begin
            if CurStep = ssPostInstall then
              Exec(ExpandConstant('{sys}\ie4uinit.exe'), '-show', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
          end;
          "@ | Set-Content -Path $setup -Encoding UTF8
          choco install innosetup --yes --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $setup
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "installer\StoreInventoryManagement_Setup_v$version.exe")) { throw "Installer was not created." }
      - name: Calculate release SHA256 values
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash "source\dist\StoreInventoryManagement\StoreInventoryManagement.exe" -Algorithm SHA256).Hash.ToLower()
          $setupPath = "installer\StoreInventoryManagement_Setup_v1.0.87.exe"
          $setupHash = (Get-FileHash $setupPath -Algorithm SHA256).Hash.ToLower()
          "EXE_SHA256=$exeHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$setupHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Create GitHub Release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.87
          name: Store Inventory Management v1.0.87
          generate_release_notes: true
          files: |
            installer/StoreInventoryManagement_Setup_v1.0.87.exe
      - name: Update version manifest
        shell: pwsh
        run: |
          $version = "1.0.87"
          $url = "https://github.com/${{ github.repository }}/releases/download/v1.0.87/StoreInventoryManagement_Setup_v1.0.87.exe"
          $manifest = @{ version = $version; url = $url; sha256 = $env:SETUP_SHA256 } | ConvertTo-Json
          Set-Content -Path "version.json" -Value $manifest -Encoding UTF8
      - name: Commit version manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Update version manifest to v1.0.87" || Write-Host "No manifest changes to commit"
          git pull --rebase origin main
          git push
