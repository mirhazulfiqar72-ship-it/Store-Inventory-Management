name: Build Store Inventory Management

on:
  push:
    branches:
      - main
    paths-ignore:
      - version.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.x'
          architecture: x64

      - name: Extract application source
        shell: pwsh
        run: |
          if (Test-Path "source") { Remove-Item "source" -Recurse -Force }
          Expand-Archive -LiteralPath "Store_Inventory_GITHUB_AUTO_UPDATER_PATCH_V1.zip" -DestinationPath "source" -Force
          Copy-Item -LiteralPath "storage_lock.py" -Destination "source\storage_lock.py" -Force
          if (-not (Test-Path "source\store_inventory.py")) { throw "store_inventory.py was not found inside the source ZIP." }
          if (-not (Test-Path "source\updater.py")) { throw "updater.py was not found inside the source ZIP." }
          if (-not (Test-Path "source\firebase_sync.py")) { throw "firebase_sync.py was not found inside the source ZIP." }
          if (-not (Test-Path "source\firebase_database_url.txt")) { throw "firebase_database_url.txt was not found inside the source ZIP." }

      - name: Patch Firebase and Help update features
        shell: cmd
        run: |
          python ci_patch_source.py
          if errorlevel 1 exit /b 1

      - name: Set release version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $path = "source\updater.py"
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, 'APP_VERSION\s*=\s*["''][^"'']*["'']', "APP_VERSION = `"$version`"")
          Set-Content -Path $path -Value $text -Encoding UTF8
          Write-Host "Building application version $version"

      - name: Set up Python dependencies
        shell: cmd
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          if errorlevel 1 exit /b 1
          pip install pyinstaller reportlab python-docx openpyxl requests pywin32 pymupdf pillow
          if errorlevel 1 exit /b 1

      - name: Validate Firebase, updater, storage and application source
        shell: cmd
        working-directory: source
        run: |
          python -c "import sys; print('Python:', sys.version); assert sys.version_info[:2] == (3, 12), sys.version"
          if errorlevel 1 exit /b 1
          python -m py_compile store_inventory.py firebase_sync.py updater.py storage_lock.py
          if errorlevel 1 exit /b 1
          python -c "import firebase_sync; print('firebase_sync import: OK')"
          if errorlevel 1 exit /b 1
          python -c "import storage_lock; from pathlib import Path; storage_lock.install(); assert storage_lock.DATA_DIR == Path(r'C:\StoreInventoryManagement\Data'); assert storage_lock.BACKUP_DIR == Path(r'C:\StoreInventoryManagement\Backups'); print('Locked storage paths: OK')"
          if errorlevel 1 exit /b 1
          python -c "import storage_lock, sqlite3; from pathlib import Path; storage_lock.install(); p=Path(r'C:\StoreInventoryManagement\legacy_persistence_test.db'); d=storage_lock.DATA_DIR/'legacy_persistence_test.db'; p.unlink(missing_ok=True); d.unlink(missing_ok=True); c=sqlite3.connect(str(p)); c.execute('create table IF NOT EXISTS t (v text)'); c.execute('insert into t values (?)', ('PERSISTED',)); c.commit(); c.close(); assert d.exists(), d; c=sqlite3.connect(str(p)); assert c.execute('select v from t').fetchone()[0]=='PERSISTED'; c.close(); p.unlink(missing_ok=True); print('SQLite permanent persistence: OK')"
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; u=Path('firebase_database_url.txt').read_text(encoding='utf-8-sig').strip(); assert u.startswith('https://store-inventory-a46b0-default-rtdb.firebaseio.com'), u; print('Firebase URL: OK')"
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; t=Path('firebase_sync.py').read_text(encoding='utf-8-sig'); assert 'mto_items' in t; print('Firebase tables: OK')"
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; t=Path('store_inventory.py').read_text(encoding='utf-8-sig'); assert 'label=\"Check Update\"' in t and 'label=\"Current Version\"' in t; print('Help update controls: OK')"
          if errorlevel 1 exit /b 1

      - name: Build EXE
        shell: cmd
        working-directory: source
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --noupx --noconsole --name "StoreInventoryManagement" --collect-all reportlab --collect-all PIL --collect-all fitz --hidden-import updater --hidden-import firebase_sync --hidden-import storage_lock --hidden-import reportlab.pdfgen.canvas --hidden-import reportlab.lib.utils --hidden-import reportlab.pdfbase._fontdata --add-data "inventory_seed.csv;." --add-data "company_logo.png;." --add-data "firebase_database_url.txt;." --add-data "update_config.json;." --add-data "FIREBASE_RULES_URL_ONLY.json;." store_inventory.py
          if errorlevel 1 exit /b 1
          if not exist "dist\StoreInventoryManagement.exe" exit /b 1

      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $exe = (Resolve-Path "source\dist\StoreInventoryManagement.exe").Path
          $setup = Join-Path $PWD "StoreInventoryManagement_Setup.iss"
          @"
          #define MyAppName "Store Inventory Management"
          #define MyAppVersion "$version"
          #define MyAppPublisher "Store Inventory Management"
          #define MyAppExeName "StoreInventoryManagement.exe"

          [Setup]
          AppId={{8B1E6F8D-5D5B-4B79-9B1E-7E0E9E8D7A31}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName=C:\StoreInventoryManagement
          DisableProgramGroupPage=yes
          OutputDir=installer
          OutputBaseFilename=StoreInventoryManagement_Setup_v{#MyAppVersion}
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin
          Uninstallable=yes
          WizardStyle=modern
          SetupLogging=yes

          [Files]
          Source: "$exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "source\update_config.json"; DestDir: "{app}"; Flags: ignoreversion
          Source: "source\firebase_database_url.txt"; DestDir: "{app}"; Flags: ignoreversion
          Source: "source\FIREBASE_RULES_URL_ONLY.json"; DestDir: "{app}"; Flags: ignoreversion

          [Dirs]
          Name: "{app}"; Permissions: users-modify
          Name: "{app}\Data"; Permissions: users-modify
          Name: "{app}\Backups"; Permissions: users-modify
          Name: "{app}\Reports"; Permissions: users-modify

          [Icons]
          Name: "{autodesktop}\Store Inventory Management"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"
          Name: "{group}\Store Inventory Management"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"
          Name: "{group}\Uninstall Store Inventory Management"; Filename: "{uninstallexe}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch Store Inventory Management"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Path $setup -Encoding UTF8

          choco install innosetup --yes --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $setup
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "installer\StoreInventoryManagement_Setup_v$version.exe")) { throw "Installer was not created." }

      - name: Calculate release SHA256 values
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash "source\dist\StoreInventoryManagement.exe" -Algorithm SHA256).Hash.ToLower()
          $setupPath = "installer\StoreInventoryManagement_Setup_v1.0.${{ github.run_number }}.exe"
          $setupHash = (Get-FileHash $setupPath -Algorithm SHA256).Hash.ToLower()
          "EXE_SHA256=$exeHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$setupHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "EXE SHA256: $exeHash"
          Write-Host "Setup SHA256: $setupHash"

      - name: Create GitHub Release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Store Inventory Management v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            source/dist/StoreInventoryManagement.exe
            installer/StoreInventoryManagement_Setup_v1.0.${{ github.run_number }}.exe

      - name: Update version manifest
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/StoreInventoryManagement_Setup_v1.0.${{ github.run_number }}.exe"
          $manifest = @{
            version = $version
            url = $url
            sha256 = $env:SETUP_SHA256
          } | ConvertTo-Json
          Set-Content -Path "version.json" -Value $manifest -Encoding UTF8

      - name: Commit version manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Update version manifest to v1.0.${{ github.run_number }}" || Write-Host "No manifest changes to commit"
          git push
