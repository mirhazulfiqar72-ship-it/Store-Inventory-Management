name: Build Store Inventory Management

on:
  push:
    branches:
      - main
    paths-ignore:
      - version.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract application source
        shell: pwsh
        run: |
          if (Test-Path "source") { Remove-Item "source" -Recurse -Force }
          Expand-Archive -LiteralPath "Store_Inventory_GITHUB_AUTO_UPDATER_PATCH_V1.zip" -DestinationPath "source" -Force
          if (-not (Test-Path "source\store_inventory.py")) {
            throw "store_inventory.py was not found inside the source ZIP."
          }
          if (-not (Test-Path "source\updater.py")) {
            throw "updater.py was not found inside the source ZIP."
          }

      - name: Set release version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $path = "source\updater.py"
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, 'APP_VERSION\s*=\s*["''][^"'']*["'']', "APP_VERSION = `"$version`"")
          Set-Content -Path $path -Value $text -Encoding UTF8
          Write-Host "Building application version $version"

      - name: Set up Python dependencies
        shell: cmd
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller reportlab python-docx openpyxl requests pywin32 pymupdf pillow

      - name: Build EXE
        shell: cmd
        working-directory: source
        run: |
          python -m PyInstaller --clean --onefile --noconsole --name "StoreInventoryManagement" --collect-all reportlab --collect-all PIL --collect-all fitz --hidden-import updater --hidden-import reportlab.pdfgen.canvas --hidden-import reportlab.lib.utils --hidden-import reportlab.pdfbase._fontdata --add-data "inventory_seed.csv;." --add-data "company_logo.png;." store_inventory.py

      - name: Calculate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "source\dist\StoreInventoryManagement.exe" -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SHA256: $hash"

      - name: Create GitHub Release and upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Store Inventory Management v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: source/dist/StoreInventoryManagement.exe

      - name: Update version manifest
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/StoreInventoryManagement.exe"
          $manifest = @{
            version = $version
            url = $url
            sha256 = $env:SHA256
          } | ConvertTo-Json
          Set-Content -Path "version.json" -Value $manifest -Encoding UTF8

      - name: Commit version manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Update version manifest to v1.0.${{ github.run_number }}" || Write-Host "No manifest changes to commit"
          git push
