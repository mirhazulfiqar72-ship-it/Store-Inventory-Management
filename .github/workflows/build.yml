name: Build Store Inventory Management

on:
  push:
    branches:
      - main
    paths-ignore:
      - version.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract application source
        shell: pwsh
        run: |
          if (Test-Path "source") { Remove-Item "source" -Recurse -Force }
          Expand-Archive -LiteralPath "Store_Inventory_GITHUB_AUTO_UPDATER_PATCH_V1.zip" -DestinationPath "source" -Force
          if (-not (Test-Path "source\store_inventory.py")) { throw "store_inventory.py was not found inside the source ZIP." }
          if (-not (Test-Path "source\updater.py")) { throw "updater.py was not found inside the source ZIP." }
          if (-not (Test-Path "source\firebase_sync.py")) { throw "firebase_sync.py was not found inside the source ZIP." }
          if (-not (Test-Path "source\firebase_database_url.txt")) { throw "firebase_database_url.txt was not found inside the source ZIP." }

      - name: Inspect source UI/update structure
        shell: pwsh
        run: |
          Write-Host "===== store_inventory.py structure ====="
          Select-String -Path "source\store_inventory.py" -Pattern 'Help|help|Setting|setting|Inventory|Dashboard|menu|Menu|Button|command=' -Context 2,4 | Select-Object -First 180 | ForEach-Object { $_.ToString() }
          Write-Host "===== updater.py structure ====="
          Select-String -Path "source\updater.py" -Pattern 'APP_VERSION|version|update|Update|download|GitHub|manifest|url|sha256' -Context 2,4 | Select-Object -First 120 | ForEach-Object { $_.ToString() }

      - name: Fix Firebase configuration and sync tables
        shell: pwsh
        run: |
          $urlPath = "source\firebase_database_url.txt"
          Set-Content -Path $urlPath -Value "https://store-inventory-a46b0-default-rtdb.firebaseio.com/" -Encoding UTF8

          $syncPath = "source\firebase_sync.py"
          $sync = Get-Content $syncPath -Raw
          if ($sync -notmatch '"mto_items"') {
            $sync = $sync -replace '"items",\s*\r?\n\s*"parties",', '"items",`r`n    "mto_items",`r`n    "parties",'
          }
          Set-Content -Path $syncPath -Value $sync -Encoding UTF8

          Write-Host "Firebase URL configured. mto_items included in cloud snapshot sync."

      - name: Set release version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $path = "source\updater.py"
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, 'APP_VERSION\s*=\s*["''][^"'']*["'']', "APP_VERSION = `"$version`"")
          Set-Content -Path $path -Value $text -Encoding UTF8
          Write-Host "Building application version $version"

      - name: Set up Python dependencies
        shell: cmd
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller reportlab python-docx openpyxl requests pywin32 pymupdf pillow

      - name: Validate Firebase sync source
        shell: cmd
        working-directory: source
        run: |
          python -m py_compile store_inventory.py firebase_sync.py updater.py
          python -c "from pathlib import Path; u=Path('firebase_database_url.txt').read_text(encoding='utf-8-sig').strip(); assert u.startswith('https://store-inventory-a46b0-default-rtdb.firebaseio.com'), u; print('Firebase URL: OK')"
          python -c "from pathlib import Path; t=Path('firebase_sync.py').read_text(encoding='utf-8-sig'); assert 'mto_items' in t; print('Firebase tables: OK')"

      - name: Build EXE
        shell: cmd
        working-directory: source
        run: |
          python -m PyInstaller --clean --onefile --noconsole --name "StoreInventoryManagement" --collect-all reportlab --collect-all PIL --collect-all fitz --hidden-import updater --hidden-import firebase_sync --hidden-import reportlab.pdfgen.canvas --hidden-import reportlab.lib.utils --hidden-import reportlab.pdfbase._fontdata --add-data "inventory_seed.csv;." --add-data "company_logo.png;." --add-data "firebase_database_url.txt;." --add-data "update_config.json;." --add-data "FIREBASE_RULES_URL_ONLY.json;." store_inventory.py

      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $exe = (Resolve-Path "source\dist\StoreInventoryManagement.exe").Path
          $setup = Join-Path $PWD "StoreInventoryManagement_Setup.iss"
          @"
          #define MyAppName "Store Inventory Management"
          #define MyAppVersion "$version"
          #define MyAppPublisher "Store Inventory Management"
          #define MyAppExeName "StoreInventoryManagement.exe"

          [Setup]
          AppId={{8B1E6F8D-5D5B-4B79-9B1E-7E0E9E8D7A31}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName=C:\StoreInventoryManagement
          DisableProgramGroupPage=yes
          OutputDir=installer
          OutputBaseFilename=StoreInventoryManagement_Setup_v{#MyAppVersion}
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin
          Uninstallable=yes
          WizardStyle=modern
          SetupLogging=yes

          [Files]
          Source: "$exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "source\update_config.json"; DestDir: "{app}"; Flags: ignoreversion
          Source: "source\firebase_database_url.txt"; DestDir: "{app}"; Flags: ignoreversion
          Source: "source\FIREBASE_RULES_URL_ONLY.json"; DestDir: "{app}"; Flags: ignoreversion
          Source: "source\firebase_sync.py"; DestDir: "{app}"; Flags: ignoreversion

          [Dirs]
          Name: "{app}\Data"
          Name: "{app}\Backups"
          Name: "{app}\Reports"

          [Icons]
          Name: "{autodesktop}\Store Inventory Management"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"
          Name: "{group}\Store Inventory Management"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"
          Name: "{group}\Uninstall Store Inventory Management"; Filename: "{uninstallexe}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch Store Inventory Management"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Path $setup -Encoding UTF8

          choco install innosetup --yes --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $setup
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "installer\StoreInventoryManagement_Setup_v$version.exe")) { throw "Installer was not created." }

      - name: Calculate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "source\dist\StoreInventoryManagement.exe" -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "EXE SHA256: $hash"

      - name: Create GitHub Release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Store Inventory Management v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            source/dist/StoreInventoryManagement.exe
            installer/StoreInventoryManagement_Setup_v1.0.${{ github.run_number }}.exe

      - name: Update version manifest
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/StoreInventoryManagement.exe"
          $manifest = @{
            version = $version
            url = $url
            sha256 = $env:SHA256
          } | ConvertTo-Json
          Set-Content -Path "version.json" -Value $manifest -Encoding UTF8

      - name: Commit version manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Update version manifest to v1.0.${{ github.run_number }}" || Write-Host "No manifest changes to commit"
          git push
